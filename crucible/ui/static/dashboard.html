<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crucible — Schematic Review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e4ec;
      --muted: #8b8fa8;
      --pass: #22c55e;
      --warn: #f59e0b;
      --fail: #ef4444;
      --match: #22c55e;
      --mismatch: #ef4444;
      --missing: #f59e0b;
      --accent: #6366f1;
      --accent-hover: #4f52e0;
      --dot-size: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    header h1 span { color: var(--muted); font-weight: 400; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .summary-chips { display: flex; gap: 8px; }
    .chip {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .chip-fail { background: #3b1414; color: var(--fail); border: 1px solid #5a1f1f; }
    .chip-warn { background: #2d2010; color: var(--warn); border: 1px solid #4a3510; }
    .chip-pass { background: #0d2b1a; color: var(--pass); border: 1px solid #1a4a2a; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }
    #btn-run {
      background: var(--accent);
      color: #fff;
    }
    #btn-run:hover { background: var(--accent-hover); }
    #btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Main layout ─────────────────────────────────────────── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Schematic pane ──────────────────────────────────────── */
    #schematic-pane {
      flex: 1;
      position: relative;
      overflow: auto;
      background: #111318;
      border-right: 1px solid var(--border);
    }

    #schematic-wrap {
      position: relative;
      display: inline-block;
      min-width: 100%;
      min-height: 100%;
    }

    #schematic-svg-obj {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Overlay dots */
    .finding-dot {
      position: absolute;
      width: var(--dot-size);
      height: var(--dot-size);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      border: 2px solid rgba(0,0,0,0.4);
      transition: transform 0.12s, box-shadow 0.12s;
      z-index: 10;
    }
    .finding-dot:hover, .finding-dot.active {
      transform: translate(-50%, -50%) scale(1.5);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }
    .dot-FAIL, .dot-MISMATCH { background: var(--fail); }
    .dot-WARN, .dot-MISSING  { background: var(--warn); }
    .dot-PASS, .dot-MATCH    { background: var(--pass); }

    /* ── Right panel ─────────────────────────────────────────── */
    #right-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section {
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .panel-section-header {
      padding: 8px 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      background: var(--surface);
      flex-shrink: 0;
    }

    /* Findings list */
    #findings-list {
      flex: 1;
      overflow-y: auto;
      max-height: 280px;
    }
    .finding-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .finding-row:hover { background: rgba(255,255,255,0.04); }
    .finding-row.active { background: rgba(99,102,241,0.12); }

    .finding-row.resolved { opacity: 0.45; text-decoration: line-through; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-color-FAIL, .dot-color-MISMATCH { background: var(--fail); }
    .dot-color-WARN, .dot-color-MISSING  { background: var(--warn); }
    .dot-color-PASS, .dot-color-MATCH    { background: var(--pass); }

    .finding-row-body { flex: 1; min-width: 0; }
    .finding-row-title {
      font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .finding-row-meta { font-size: 10px; color: var(--muted); margin-top: 1px; }

    .action-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
      padding: 2px 6px; border-radius: 4px;
      background: rgba(99,102,241,0.2); color: var(--accent);
    }

    /* Detail pane */
    #detail-pane {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }
    #detail-pane .empty {
      color: var(--muted);
      font-size: 12px;
      padding: 20px 0;
      text-align: center;
    }

    .detail-status {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      padding: 3px 10px; border-radius: 4px; margin-bottom: 10px;
    }
    .status-FAIL, .status-MISMATCH { background: #3b1414; color: var(--fail); }
    .status-WARN, .status-MISSING  { background: #2d2010; color: var(--warn); }
    .status-PASS, .status-MATCH    { background: #0d2b1a; color: var(--pass); }

    .detail-field { margin-bottom: 10px; }
    .detail-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
    .detail-value { font-size: 12px; line-height: 1.5; word-break: break-word; }
    .detail-value.fix { color: var(--warn); }

    .action-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn-action {
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); }
    .btn-resolve:hover { border-color: var(--pass); color: var(--pass); }
    .btn-escalate { border-color: var(--fail); color: var(--fail); background: #3b1414; }
    .btn-escalate:hover { background: #5a1f1f; }

    .note-area {
      margin-top: 10px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 8px;
      resize: vertical;
      min-height: 60px;
    }
    .note-area:focus { outline: 1px solid var(--accent); }

    /* Running pulse indicator */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #run-indicator {
      display: none;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    body.reviewing #run-indicator { display: inline-block; }
    body.reviewing #btn-run { background: #2a2d3a; color: var(--muted); cursor: not-allowed; }

    /* SSE log */
    #log-section { height: 220px; flex-shrink: 0; display: flex; flex-direction: column; }
    #log-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      font-size: 11px;
      color: #6b7080;
      background: #0a0c12;
      line-height: 1.7;
    }
    #log-output .log-line   { white-space: pre-wrap; word-break: break-all; color: #9ba3b8; }
    #log-output .log-header { color: var(--accent); font-weight: 700; }
    #log-output .log-sep    { color: #2a2d3a; }
    #log-output .log-done   { color: var(--pass); font-weight: 700; }
    #log-output .log-error  { color: var(--fail); }
    #log-output .log-warn   { color: var(--warn); }
    #log-output .log-meta   { color: #5a6070; font-style: italic; }
    #log-output .log-fail   { color: var(--fail); font-weight: 600; }
    #log-output .log-pass   { color: var(--pass); }
    #log-output .log-empty  { color: #3a3d4a; padding: 16px 0; text-align: center; }
  </style>
</head>
<body>

<header>
  <h1>Crucible <span>/ Schematic Review</span></h1>
  <div class="header-right">
    <div class="summary-chips">
      <span class="chip chip-fail" id="chip-fail">— FAIL</span>
      <span class="chip chip-warn" id="chip-warn">— WARN</span>
      <span class="chip chip-pass" id="chip-pass">— PASS</span>
    </div>
    <span id="run-indicator"></span>
    <button id="btn-run" onclick="triggerReview()">▶ Run Review</button>
  </div>
</header>

<main>
  <!-- Left: schematic + dot overlays -->
  <div id="schematic-pane">
    <div id="schematic-wrap">
      <img id="schematic-svg-obj" src="/schematic.svg" alt="Schematic" />
      <div id="dot-layer"></div>
    </div>
  </div>

  <!-- Right: findings list + detail + log -->
  <div id="right-panel">

    <div class="panel-section" style="flex:0 0 auto;">
      <div class="panel-section-header">Findings</div>
      <div id="findings-list"></div>
    </div>

    <div class="panel-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <div class="panel-section-header">Detail</div>
      <div id="detail-pane"><div class="empty">Select a finding</div></div>
    </div>

    <div class="panel-section" id="log-section">
      <div class="panel-section-header">Agent Log</div>
      <div id="log-output"><div class="log-empty">Click ▶ Run Review to start</div></div>
    </div>

  </div>
</main>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let findings = [];
  let selectedId = null;
  let sseSource = null;

  // ── Boot ─────────────────────────────────────────────────────────────────
  window.addEventListener('load', async () => {
    await loadFindings();
    // Recompute dot positions when schematic image loads/resizes
    const img = document.getElementById('schematic-svg-obj');
    img.addEventListener('load', renderDots);
    window.addEventListener('resize', renderDots);
  });

  // ── Load findings from API ────────────────────────────────────────────────
  async function loadFindings() {
    try {
      const resp = await fetch('/api/findings');
      findings = await resp.json();
    } catch (e) {
      findings = [];
    }
    renderList();
    renderDots();
    updateChips();
  }

  // ── Findings list ─────────────────────────────────────────────────────────
  function renderList() {
    const el = document.getElementById('findings-list');
    if (!findings.length) {
      el.innerHTML = '<div style="padding:12px 14px;color:var(--muted);font-size:12px;">No findings yet — run a review.</div>';
      return;
    }
    el.innerHTML = findings.map(f => {
      const resolved = f.engineer_action === 'resolved';
      const badge = f.engineer_action
        ? `<span class="action-badge">${f.engineer_action}</span>`
        : '';
      return `
        <div class="finding-row ${resolved ? 'resolved' : ''} ${selectedId === f.id ? 'active' : ''}"
             id="row-${cssId(f.id)}" onclick="selectFinding('${f.id}')">
          <div class="status-dot dot-color-${f.status}"></div>
          <div class="finding-row-body">
            <div class="finding-row-title">${f.check} — ${f.ref}</div>
            <div class="finding-row-meta">${f.source} · ${f.status}</div>
          </div>
          ${badge}
        </div>`;
    }).join('');
  }

  function updateChips() {
    const fail = findings.filter(f => f.status === 'FAIL' || f.status === 'MISMATCH').length;
    const warn = findings.filter(f => f.status === 'WARN' || f.status === 'MISSING').length;
    const pass = findings.filter(f => f.status === 'PASS' || f.status === 'MATCH').length;
    document.getElementById('chip-fail').textContent = `${fail} FAIL`;
    document.getElementById('chip-warn').textContent = `${warn} WARN`;
    document.getElementById('chip-pass').textContent = `${pass} PASS`;
  }

  // ── SVG dot overlays ──────────────────────────────────────────────────────
  function renderDots() {
    const img = document.getElementById('schematic-svg-obj');
    const layer = document.getElementById('dot-layer');
    layer.innerHTML = '';

    if (!img.naturalWidth) return;

    const scaleX = img.clientWidth / img.naturalWidth;
    const scaleY = img.clientHeight / img.naturalHeight;

    // KiCad SVG: origin is top-left, units are mm at 96dpi (1mm = 3.7795px in KiCad SVG export)
    const MM_TO_PX = 3.7795;

    findings.forEach(f => {
      if (!f.coords) return;
      const [mx, my] = f.coords;
      const px = mx * MM_TO_PX * scaleX;
      const py = my * MM_TO_PX * scaleY;

      const dot = document.createElement('div');
      dot.className = `finding-dot dot-${f.status} ${selectedId === f.id ? 'active' : ''}`;
      dot.style.left = `${px}px`;
      dot.style.top = `${py}px`;
      dot.title = `${f.check} — ${f.ref}: ${f.finding}`;
      dot.onclick = () => selectFinding(f.id);
      layer.appendChild(dot);
    });
  }

  // ── Detail pane ───────────────────────────────────────────────────────────
  function selectFinding(id) {
    selectedId = id;
    renderList();
    renderDots();

    const f = findings.find(x => x.id === id);
    if (!f) return;

    const fixHtml = f.fix
      ? `<div class="detail-field">
           <div class="detail-label">Fix</div>
           <div class="detail-value fix">${escHtml(f.fix)}</div>
         </div>`
      : '';

    const noteHtml = f.note
      ? `<div class="detail-field">
           <div class="detail-label">Note</div>
           <div class="detail-value">${escHtml(f.note)}</div>
         </div>`
      : '';

    const actionDisabled = f.engineer_action === 'resolved' ? 'disabled' : '';

    document.getElementById('detail-pane').innerHTML = `
      <span class="detail-status status-${f.status}">${f.status}</span>
      <div class="detail-field">
        <div class="detail-label">Ref</div>
        <div class="detail-value">${escHtml(f.ref)}</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Check</div>
        <div class="detail-value">${escHtml(f.check)}</div>
      </div>
      <div class="detail-field">
        <div class="detail-label">Finding</div>
        <div class="detail-value">${escHtml(f.finding)}</div>
      </div>
      ${fixHtml}
      <div class="detail-field">
        <div class="detail-label">Rule basis</div>
        <div class="detail-value" style="color:var(--muted)">${escHtml(f.rule_basis)}</div>
      </div>
      ${noteHtml}
      <textarea class="note-area" id="note-input" placeholder="Add a note…">${f.note || ''}</textarea>
      <div class="action-row">
        <button class="btn-action btn-resolve" ${actionDisabled}
                onclick="doAction('${id}', 'resolved')">✓ Resolve</button>
        <button class="btn-action btn-escalate"
                onclick="doAction('${id}', 'escalated')">↑ Escalate → Bill</button>
        <button class="btn-action"
                onclick="doAction('${id}', 'noted')">✎ Save Note</button>
      </div>
    `;
  }

  async function doAction(id, action) {
    const noteEl = document.getElementById('note-input');
    const note = noteEl ? noteEl.value.trim() : null;
    await fetch(`/api/findings/${encodeURIComponent(id)}/action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, note: note || null }),
    });
    await loadFindings();
    selectFinding(id);
  }

  // ── Review trigger + SSE ──────────────────────────────────────────────────
  async function triggerReview() {
    document.body.classList.add('reviewing');
    const logEl = document.getElementById('log-output');
    logEl.innerHTML = '';

    const resp = await fetch('/api/review/trigger', { method: 'POST' });
    const data = await resp.json();
    if (!data.ok) {
      appendLog(logEl, 'warn', data.message || 'Could not start review.');
      document.body.classList.remove('reviewing');
      return;
    }

    if (sseSource) sseSource.close();
    sseSource = new EventSource('/api/review/stream');

    sseSource.onmessage = (e) => {
      const payload = JSON.parse(e.data);
      if (payload.done) {
        sseSource.close();
        document.body.classList.remove('reviewing');
        appendLog(logEl, 'done', '── Review complete ─────────────────────────────');
        logEl.scrollTop = logEl.scrollHeight;
        loadFindings();
        return;
      }
      appendLog(logEl, classifyLine(payload), payload);
      logEl.scrollTop = logEl.scrollHeight;
    };

    sseSource.onerror = () => {
      sseSource.close();
      document.body.classList.remove('reviewing');
      appendLog(logEl, 'error', 'SSE connection lost.');
    };
  }

  function appendLog(el, cls, text) {
    const div = document.createElement('div');
    div.className = `log-line log-${cls}`;
    div.textContent = text;
    el.appendChild(div);
  }

  function classifyLine(line) {
    if (!line || !line.trim()) return 'meta';
    const l = line.toLowerCase();
    if (l.includes('error') || l.includes('failed') || l.includes('fail:')) return 'error';
    if (l.includes('warning') || l.includes('warn')) return 'warn';
    if (l.includes('── review') || l.includes('──────')) return 'sep';
    if (l.includes('spawning') || l.includes('invoking') || l.includes('agent')) return 'header';
    if (l.match(/\d+ fail/) && line.match(/FAIL/)) return 'fail';
    if (l.includes('pass') || l.includes('complete') || l.includes('done')) return 'pass';
    if (l.startsWith('[') && l.includes('dashboard:')) return 'meta';
    return 'line';
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function cssId(s) {
    return s.replace(/[^a-zA-Z0-9_-]/g, '_');
  }
</script>
</body>
</html>
